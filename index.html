<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#c4321f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="汉语">
<meta name="description" content="رفيق تعلّم الصينية للناطقين بالعربية: دروس، كلمات، قواعد، تراكيب، أحرف ونطق.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>汉语 · رفيق تعلّم الصينية</title>
<style>
:root{--bg:#f5efe3;--card:#fffdf7;--ink:#1e1a15;--mut:#7b7163;--line:#e5dac6;--red:#c4321f;--red2:#fbe9e3;--jade:#1d7a5d;--jade2:#e2f1ea;--gold:#a97a1e;--gold2:#f6ecd3;--blue:#2c5c9a;--sh:0 1px 2px rgba(60,40,10,.06),0 6px 18px rgba(60,40,10,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#14120e;--card:#1e1b16;--ink:#f1e9db;--mut:#a39986;--line:#342e25;--red:#ef6a52;--red2:#3a1d17;--jade:#58c29f;--jade2:#17302a;--gold:#e0b458;--gold2:#33290f;--blue:#8db4ea;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Geeza Pro","Noto Sans Arabic","Segoe UI",sans-serif;padding-bottom:84px}
.zh{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei","Heiti SC",sans-serif;direction:ltr;unicode-bidi:isolate}
.kai{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC","Noto Serif SC",serif}
.py{direction:ltr;unicode-bidi:isolate;color:var(--red);font-weight:600;letter-spacing:.2px}
.en{direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding:14px 14px 20px}
h1{font-size:24px;margin:6px 0 2px;line-height:1.3}
h2{font-size:18px;margin:22px 0 10px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;flex:none}
.hero{background:linear-gradient(135deg,#c4321f,#8f1d10);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;margin-bottom:14px}
.hero .big{position:absolute;inset-inline-end:-6px;bottom:-34px;font-size:130px;opacity:.14;line-height:1}
.hero h1{margin:0;font-size:22px}.hero p{margin:4px 0 12px;opacity:.9;font-size:14px}
.stats{display:flex;gap:8px}
.stat{flex:1;background:rgba(255,255,255,.15);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;opacity:.9}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;box-shadow:var(--sh)}
.tile b{display:block;font-size:15px}.tile span{font-size:12.5px;color:var(--mut)}
.tile i{font-style:normal;font-size:26px;display:block;margin-bottom:4px;color:var(--red)}
.book{display:flex;gap:12px;align-items:center;width:100%;text-align:start}
.seal{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:26px;flex:none;font-weight:700}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--jade);border-radius:9px}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--gold2);color:var(--gold);font-weight:700;flex:none;direction:ltr}
.num.ok{background:var(--jade2);color:var(--jade)}
.les .t{font-size:18px;font-weight:600}.les .s{font-size:12.5px;color:var(--mut)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--gold2);color:var(--gold);font-weight:600}
.badge.ok{background:var(--jade2);color:var(--jade)}.badge.red{background:var(--red2);color:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.w{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.w:last-child{border-bottom:0}
.sp{width:40px;height:40px;border-radius:50%;background:var(--red2);color:var(--red);display:grid;place-items:center;flex:none}
.sp svg{width:18px;height:18px}
.sp.sm{width:34px;height:34px}
.wz{font-size:26px;min-width:64px;font-weight:500}
.wm{flex:1;min-width:0;line-height:1.35}
.wm .en{font-size:14px;display:block;text-align:start}
.wm .ar{font-size:13.5px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.b1,.dot.b2{background:var(--gold)}.dot.b3,.dot.b4,.dot.b5{background:var(--jade)}
.x{color:var(--mut);font-size:18px;padding:4px 8px}
details.g{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 14px}
details.g summary{list-style:none;padding:12px 0;cursor:pointer}
details.g summary::-webkit-details-marker{display:none}
.gt{font-weight:700;display:block}
.gf{display:block;margin-top:4px;font-size:14.5px;color:var(--blue);direction:rtl;unicode-bidi:plaintext;text-align:start}
details.g p{margin:0 0 8px;font-size:14.5px}
.ex{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.ex .z{font-size:19px}.ex .a{font-size:13.5px;color:var(--mut)}.ex .py{font-size:13.5px;display:block}
.ref{font-size:12px;color:var(--mut);padding-bottom:12px}
.sen{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.sen .z{font-size:22px;line-height:1.5}
.sen .py{display:block;font-size:14.5px}.sen .en{display:block;font-size:14px;text-align:start}.sen .a{font-size:14px;color:var(--mut)}
.hide{filter:blur(7px);user-select:none}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--red);color:#fff;font-weight:700;text-align:center}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.jade{background:var(--jade)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.pill{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px}
.pill.on{background:var(--jade2);color:var(--jade);border-color:transparent}
.note{background:var(--gold2);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.fc{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:24px 14px}
.fc .hz{font-size:92px;line-height:1.15}
.fc .py{font-size:24px}.fc .en{font-size:19px}.fc .ar{font-size:17px;color:var(--mut)}
.fc .st{font-size:14.5px;background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:6px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--red)}
.opt{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);margin-bottom:8px;font-size:17px}
.opt.zh{font-size:26px}
.opt.good{border-color:var(--jade);background:var(--jade2)}.opt.bad{border-color:var(--red);background:var(--red2)}
.qp{text-align:center;padding:18px 8px}.qp .hz{font-size:72px;line-height:1.2}.qp .m{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ch{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:32px;display:grid;place-items:center;position:relative}
.ch .dot{position:absolute;top:6px;inset-inline-end:6px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.add{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.add input{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
.add .btn{grid-column:1/-1}
.tone{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tone:last-child{border:0}.tone .hz{font-size:30px;width:44px;text-align:center}
.pair{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--bg);margin:0 0 6px 6px;font-size:20px}
.pair .py{font-size:14px}
.ptw{display:flex;flex-direction:column;align-items:center;min-width:84px;max-width:110px;text-align:center;flex:none}
.ptw .py{font-size:15px}
.ptz{font-size:44px;line-height:1.2;color:var(--gold);font-weight:600}
.ptw .sub{margin:2px 0 0;font-size:12.5px;line-height:1.4}
.ptf{background:var(--gold2);border-radius:12px;padding:10px 12px;font-size:19px;font-weight:600;display:inline-block;line-height:1.5;text-align:center}
.pte{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:12px}
.pte .z{font-size:22px;line-height:1.6}.pte .py{display:block;font-size:14.5px}.pte .en{display:block;font-size:14px;text-align:start}.pte .a{font-size:14px;color:var(--mut)}
mark{background:var(--gold2);color:inherit;border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--gold)}
#nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
#nav button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--mut);font-size:11.5px;padding:4px 0}
#nav b{font-size:22px;line-height:1.25;font-weight:500}
#nav .on{color:var(--red)}
.qa .z{font-size:21px;line-height:1.5}.qa .py{display:block;font-size:14px}.qa .a{font-size:13.5px;color:var(--mut)}
.qaa{background:var(--bg);border-radius:12px;padding:10px;margin-top:10px}
.refx{margin:0 0 4px;padding-inline-start:50px}
#nav button{font-size:10.5px}#nav b{font-size:20px}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}
.lang button{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px}
.lang .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
[dir=ltr] .back,[dir=ltr] .les>span:last-child,[dir=ltr] .book>span:last-child{display:inline-block;transform:scaleX(-1)}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:8}
#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:720px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));text-align:center}
#sheet .hz{font-size:110px;line-height:1.1}

是很好. Here 很 is a light link, not always “very”. Negative: 不 + adjective.",["I'm fine.","Chinese isn't difficult."]],"nounp":["Noun predicates (age, date, price, time)","subject + noun/number (no 是)","With days, dates, ages and prices, 是 is dropped. The negative needs 不是.",["Today is Monday.","I'm twenty years old."]],"shi":["是 sentences (to be)","A + 是 + B ｜ negative: A + 不是 + B","Links a noun to a noun (identity, nationality, job). It is not used before adjectives.",["I'm a student.","He isn't a teacher."]],"subjpred":["A subject-predicate phrase as the predicate","topic + (part of it + 很 + adjective)","Describes one part of a person or thing: “He, height is tall”.",["He is tall."]],"svo":["Basic order: subject + verb + object","subject + verb + object","The subject always comes before the verb. There is no conjugation, no plural and no gender.",["I buy a book.","Mom drinks tea."]],"tp":["Time and place before the verb","subject + time + (在 + place) + verb + object","Time comes after the subject (or before it) and always before the verb; then the place; then the verb.",["I get up at seven every day.","Tomorrow I'll read in the library."]],"attr":["The modifier comes before the noun","modifier + 的 + noun","Adjectives and possessors go before the noun.",["a beautiful school","my new classmate"]],"serial":["Serial verbs","subject + 去/来 + place + verb 2","Two verbs in a row with the same subject; the second is the purpose.",["I go to the supermarket to buy fruit."]],"pivot":["Pivotal sentences (请/叫/让)","subject + 请 + person + verb","The object of the first verb is the subject of the second.",["The teacher invites us to eat."]],"lihe":["Separable verbs (离合词)","verb + (something) + noun","Verbs like 睡觉, 上课 and 洗澡 are really verb + noun, so a duration or number goes in between.",["I slept eight hours."]],"bu":["Negation with 不","不 + verb/adjective","For the present, habits, the future and adjectives. Pronounced bú before a fourth tone (不是 bú shì).",["I don't drink coffee.","He isn't going."]],"mei":["Negation with 没(有)","没(有) + verb ｜ 没有 + noun","Negates 有 (not have / there is no) and past actions. Never say 不有, and do not use 了 with 没.",["I don't have a younger sister.","I didn't go yesterday."]],"de1":["的 for possession and description","owner + 的 + thing","我的书 = my book. Often dropped with family members and close places: 我妈妈, 我们学校.",["This is my book.","My mom is a doctor."]],"de3":["的 / 地 / 得","modifier + 的 + noun ｜ manner + 地 + verb ｜ verb + 得 + description","All three are pronounced de: 的 before a noun, 地 before a verb, 得 after a verb.",["He said happily.","He speaks fast."]],"you1":["有 for possession","subject + 有 + thing ｜ negative: 没有","“To have”. The negative is always 没有.",["I have one older brother.","Our class has twenty students."]],"you2":["有 for existence (there is)","place + 有 + thing","“In the place there is…”. The place comes first, then 有.",["There is a library in the school."]],"zai":["在 for location (to be at)","thing/person + 在 + place","The known thing first, then 在, then the place. Compare: 有 = there is something (indefinite); 在 = the (definite) thing is at…",["Where is the bank?","The canteen is beside the library.","I live in the dorm."]],"zaiV":["在 + place + verb","subject + 在 + place + verb","The place where the action happens comes before the verb.",["I study Chinese in Shanghai."]],"fangwei":["Position words (方位词)","noun + (的) + 前边/后边/里边/外边/旁边/左边/右边","The position word follows the noun: “library front” = in front of the library.",["in front of the library","The dorm is behind the canteen."]],"mw":["Measure words (量词)","number + measure word + noun","A number never goes directly before a noun. Common ones: 个 gè (general), 本 běn (books), 口 kǒu (family members), 张 zhāng (flat things), 斤 jīn (half a kilo). They are also needed after 这/那/几.",["three people","two books","this student"]],"erliang":["二 or 两?","两 + measure word ｜ 二 in counting and numbers","“Two of something” = 两 (两个, 两本, 两斤). In counting, numbers and ordinals = 二 (十二, 二十, 第二).",["two people","twelve students"]],"duo":["多 for approximate numbers","number + 多 + measure word","“More than…”: 二十多个 = twenty-odd.",["Our class has over twenty students."]],"money":["Money and prices","… 多少钱？｜ number + 块 + number + 毛","块 kuài (yuan), 毛 máo (a tenth of a yuan), 分 fēn. To ask a price by weight: 多少钱一斤？",["How much is a jin of apples?","25 yuan altogether."]],"week":["Days of the week","星期 + number (1–6) ｜ 星期天","Monday 星期一 … Saturday 星期六, Sunday 星期天/星期日. The question: 星期几？",["What day is it today?","Tomorrow is Friday."]],"date":["Dates","年 + 月 + 号 (largest to smallest)","Year, then month, then day. Months are numbered: 一月 January … 十二月 December.",["What's the date today?","November 11th"]],"clock":["Clock time","number + 点 + (number + 分) ｜ 半 ｜ 一刻","点 diǎn o'clock, 分 fēn minute, 半 bàn half, 一刻 yí kè a quarter. Two o'clock = 两点.",["What time is it now?","half past eight"]],"yehai":["也 and 还 (also)","subject + 也/还 + verb","The adverb always goes before the verb, never at the end. 也: another subject does the same thing. 还: the same subject does something more.",["I'm a student too.","I have an older brother and also a younger sister."]],"dou":["都 (all / both)","subject (plural) + 都 + verb","After the subject and before the verb. With 也 the order is 也都.",["We all study Chinese."]],"jiucai":["就 and 才","time + 就 + verb (early) ｜ time + 才 + verb (late)","就 = it happened early or easily. 才 = it happened late or with difficulty (no 了).",["He got up as early as six.","He didn't get up until ten."]],"youdianr":["有点儿 and 一点儿","有点儿 + adjective (negative) ｜ adjective + 一点儿 (comparison) ｜ verb + 一点儿 + noun","有点儿 goes before an adjective for a mild complaint. 一点儿 goes after an adjective or before a noun = a little.",["I'm a bit tired.","A bit cheaper, please."]],"yijing":["已经 … 了 (already)","已经 + verb + 了","The action is already done.",["I've already eaten."]],"xiangyao":["想 and 要 (want)","subject + 想/要 + verb","想 is a wish (“would like”); 要 is a stronger will or an order (“want / I'll take”). The negative of both is usually 不想.",["I'd like to drink tea.","I want two jin of apples."]],"hui":["会 / 能 / 可以 (can)","subject + 会/能/可以 + verb","会: a learned skill. 能: ability, or circumstances allow it. 可以: permission.",["I can speak Chinese.","May I come in?"]],"le1":["了 after the verb (completed action)","verb + 了 + (number + measure word) + object","Shows that the action is completed. Negative: 没 + verb (without 了).",["I bought two books.","We went to Tianjin at the weekend."]],"le2":["了 at the end of the sentence (change of state)","sentence + 了","A new situation: “has become / now”.",["He got sick.","I've moved."]],"guo":["过 (past experience)","verb + 过 ｜ negative: 没 + verb + 过","“Have (ever) done”.",["I have been to Beijing.","I've never eaten dumplings."]],"zhe":["着 (continuing state)","verb + 着","A continuing state that results from an action.",["The door is open."]],"zhengzai":["在 / 正在 (action in progress)","subject + 在/正在 + verb (+ 呢)","Like “am doing now”.",["I'm watching the news.","What are you doing?"]],"kuaile":["快…了 / 要…了 (about to)","快/要/快要 + verb + 了","Something will happen soon.",["Christmas is coming.","It's going to rain."]],"bi":["Comparison with 比","A + 比 + B + adjective","Do not put 很 before the adjective. Negative: A 没有 B + adjective.",["Shanghai is hotter than Beijing.","I'm not as tall as him."]],"result":["Result complements","verb + result (完/好/懂/见/到) ｜ negative: 没 + verb + result","A word after the verb shows its result: 完 finished, 好 done properly, 懂 understood, 见 perceived.",["The computer has been fixed.","I didn't understand (what I heard)."]],"degree":["Manner and degree complement with 得","verb + 得 + (很) + adjective","Describes how the action is done. With an object: object + verb + 得 …",["He speaks well.","Time really flies."]],"direction":["Direction complements","verb + 来/去 ｜ 上/下/进/出/回 + 来/去","来 is toward the speaker, 去 is away from the speaker.",["Please come in.","He went back."]],"duration":["Duration and frequency complements","verb + duration ｜ verb + number + 次","A duration comes after the verb (unlike the time when something happens, which comes before it).",["I study two hours every day.","I went once."]],"congdao":["从…到… (from … to …)","从 + start + 到 + end","For both place and time.",["from eight to ten","It's close from the school to the bank."]],"gei":["给 (to, for / to give)","subject + 给 + person + verb ｜ 给 + person + thing","The verb “give” and also the preposition “to / for”.",["I call my mom.","He gave me a book."]],"wang":["往 (toward)","往 + direction + verb","For giving directions.",["Go straight ahead.","Turn right."]],"yibian":["一边…一边… (at the same time)","一边 + verb 1 + 一边 + verb 2","Two actions happen together.",["He eats while looking at his phone."]],"xianranhou":["先…然后/再… (first … then …)","先 + verb 1, 然后/再 + verb 2","The order of events.",["We eat first, then go to the museum."]],"yijiu":["一…就… (as soon as)","一 + verb 1 + 就 + verb 2","The second event follows the first immediately.",["As soon as class ends I go to the canteen.","As soon as November comes it gets cold."]],"yinwei":["因为…所以… (because … so …)","因为 + reason, 所以 + result","The reason first, then the result; both words are used together.",["Because it's raining, I'm not going."]],"ruguo":["如果…就… (if … then …)","如果 + condition, (subject) + 就 + result","就 comes after the subject of the second clause.",["If you're not busy, let's go and eat."]],"suiran":["虽然…但是… (although … but …)","虽然 + … , 但是 + …","In Chinese both words are used together.",["Although it's expensive, it's tasty."]],"chule":["除了…以外 / 而且 / 为了","除了 A 以外，还/都… ｜ … 而且 … ｜ 为了 + purpose","除了…还 = in addition to. 除了…都 = except. 而且 = and also. 为了 = in order to.",["Besides dumplings, I also like noodles.","I came to China to learn Chinese."]],"ba":["吧 for suggestions and guesses","sentence + 吧","Softens a command into a suggestion (“let's…”), or marks a guess (“…, right?”).",["Let's go to the canteen.","You're an international student, right?"]],"qing":["请 and 请问 (please)","请 + verb ｜ 请问, + question","请 before a verb makes a polite request. 请问 goes before any question to a stranger.",["Please sit down.","Excuse me, where is the bank?"]],"bie":["别 (don't)","别 + verb","For telling someone not to do something.",["Don't talk."]],"bazi":["把 sentences","subject + 把 + object + verb + (在/到 + place)","Moves the object before the verb to show what is done to it and where it ends up.",["Please put the book on the table."]]},"CH":[["you","亻 person + 尔","the person in front of you = you"],["good","女 woman + 子 child","a mother with her child = something good"],["I, me","手 hand + 戈 spear","I am the one holding the spear"],["he","亻 person + 也","another person “also” = he"],["she","女 woman + 也","another woman = she"],["plural marker","亻 person + 门 door (sound mén)","people at the door = a group"],["you (polite)","你 you + 心 heart","“you” from the heart = respect"],["old","an old man with a stick","the old man leans on his stick"],["teacher","丨 + 帀","with 老 → 老师 teacher"],["again","一 + 冉","with 见 → 再见 “see again”"],["to see","目 eye (simplified) + 儿 legs","an eye walking on two legs = sees"],["to thank","讠 speech + 身 body + 寸 inch","words of thanks with a bow"],["not","a root under the ground","a sprout that does not come above the line = not"],["guest","宀 roof + 各 each","everyone under your roof is a guest"],["air","lines of steam","steam rising"],["correct","又 hand + 寸 inch","a hand measuring precisely = correct"],["to rise","走 walk + 己 self","to walk oneself up = get up"],["not (have)","氵 water + 殳","sunk in the water, nothing left"],["to close; relation","丷 + 天","with 系 → 没关系 never mind"],["early","日 sun + 十","the sun above the mark = early morning"],["up, on","a line above the base","the mark above the line = up"],["now","人 + 一 + ㇇","with 天 → 今天 today"],["day; sky","一 above 大 big man","the sky above the man's head"],["star","日 sun + 生 born","little suns being born = stars"],["period","其 + 月 moon","the moon's cycle = a period → 星期 week"],["to be","日 sun + 正 correct (altered)","under the sun everything is clear = “it is so”"],["middle","口 box + 丨 line","a line through the middle"],["country","囗 border + 玉 jade","treasure inside borders = country"],["person","two walking legs","a person walking"],["to learn","⺍ + 冖 roof + 子 child","a child under a roof, learning"],["to practise","a bird's wing","a young bird practising flying"],["Han (Chinese)","氵 water + 又","the Han river → 汉语 Chinese"],["language","讠 speech + 五 five + 口 mouth","five mouths talking = language"],["class","王 jade + 刂 knife + 王","jade cut with a knife = groups"],["to have","𠂇 hand + 月 meat","a hand holding a piece of meat = to have"],["many","夕 + 夕 two evenings","evening after evening = many"],["few","小 small + 丿","a bit cut off the small = few"],["money","钅 metal + 戋","metal = money"],["piece; yuan","土 earth + 夬","a piece of land"],["please","讠 speech + 青 (sound qīng)","polite words"],["to ask","门 door + 口 mouth","a mouth at the door, asking"],["silver","钅 metal + 艮","the metal silver → 银行 bank"],["shop; row","彳 + 亍 crossroads","a crossroads with shops (also read xíng = to walk)"],["to be at","才 + 土 earth","standing on the ground = present"],["which","口 mouth + 那 that","the mouth asks “that one?” = which"],["son; suffix","two legs","with 哪 → 哪儿 where"],["question particle","口 mouth + 马 horse (sound ma)","the mouth asks with the sound ma"],["and you?","口 mouth + 尼 (sound ni)","one of the “mouth” particles"],["let's","口 mouth + 巴 (sound ba)","one of the “mouth” particles"],["to be called; to call","口 mouth + 丩","the mouth calls out"],["what (什么)","亻 person + 十 ten","with 么 → 什么 what"],["suffix","丿 + 厶","appears in 什么 and 这么"],["name","夕 evening + 口 mouth","in the dark you call out your name"],["character; word","宀 roof + 子 child","a child under a roof learning characters"],["home; family","宀 roof + 豕 pig","in old times: a pig under the roof = home"],["possessive particle","白 white + 勺 spoon","the most used character in Chinese"],["dad","父 father + 巴 (sound ba)","father + the sound ba"],["mom","女 woman + 马 (sound ma)","woman + the sound ma = mama"],["older brother","可 + 可","big brother says “OK, OK”"],["older sister","女 woman + 且","a woman = sister"],["younger brother","丷 + 弓 bow + 丨","the little one plays with a bow"],["younger sister","女 woman + 未 not yet","a girl not yet grown"],["school","木 wood + 交 meet","a wooden building where students meet"],["to stay overnight","宀 roof + 亻 person + 百 hundred","a hundred people under one roof = dorm"],["dwelling","人 + 舌","with 宿 → 宿舍 dormitory"],["how many","a small table","how many things are on the table?"],["measure word","人 + 丨","one person = the unit for counting"],["two","一 + 冂 + 人人","two people under one roof"],["very","彳 step + 艮","the link before adjectives"],["also","—","appears inside 他 and 她"],["also, still","辶 walk + 不 not","has not stopped, still walking"],["all","者 + 阝 city","everyone in the city"],["this","辶 walk + 文 text","the near one you walk to"],["that","刀刀 + 阝","the far one over there"],["who","讠 speech + 隹 bird","who is speaking?"],["to go","土 earth + 厶","leaving the ground = go"],["to buy","乛 + 头 head","carrying the goods on the head"],["to want","覀 west + 女 woman","she wants something"],["book","a hand holding a brush (simplified)","writing → book"],["mouth","an open square","the shape of a mouth"],["woman","a seated woman","the “woman” radical in 好 妈 姐 妹 她"]],"QA":[["How are you?","I'm fine, thanks."],["Are you an international student?","Yes, I'm an international student."],["Are you Chinese?","No, I'm not Chinese."],["Are you busy?","I'm not busy."],["Do you have an older brother?","Yes, I have one older brother."],["Do you like drinking tea?","Yes, I like drinking tea a lot."],["Can you speak Chinese?","A little."],["Is your room clean?","Very clean."],["Is Chinese difficult?","Not too difficult."],["Are you busy?","Not busy."],["Are you a teacher?","No, I'm a student."],["Do you have a dictionary?","No, I don't."],["Are you going to the library?","Yes, I'm going this afternoon."],["Is it cold today?","It's very cold today."],["Is the dorm quiet?","Very quiet."],["Do you like dogs?","Yes, dogs are cute."],["I'm fine, and you?","I'm fine too."],["I study Chinese, and you?","I study Chinese too."],["I live in the international student dorm, and you?","I live off campus."],["I drink coffee, and you?","I drink tea."],["Where is your book?","On the table."],["What's your name?","My name is David."],["What is this?","This is a dictionary."],["What do you study?","I study Chinese."],["What do you like to eat?","I like eating noodles."],["What are you buying?","I'm buying apples."],["What is there in your room?","There is a bed, a table and a chair."],["What work do you do?","I'm a student."],["Who is he?","He is my classmate."],["Who is your teacher?","Mr. Wang is our teacher."],["Whose phone is this?","It's mine."],["Who do you live with?","I live with my roommate."],["Which country are you from?","I'm Arab."],["Where do you live?","I live in the international student dorm."],["Excuse me, where is the bank?","The bank is beside the supermarket."],["Where are you going?","I'm going to the canteen."],["Where is the toilet?","On the right."],["Where do you study Chinese?","I study Chinese in Shanghai."],["Which room do you live in?","I live in room 302."],["How many people are in your family?","There are five people in my family."],["How many books do you have?","I have three books."],["Which floor do you live on?","I live on the third floor."],["How many beds are in your room?","There are two beds."],["How many students are in your class?","Our class has over twenty students."],["What day is it today?","Today is Monday."],["What's the date today?","Today is November 15th."],["How old are you?","I'm twenty this year."],["How much is a jin of apples?","Five yuan a jin."],["How much altogether?","25 yuan altogether."],["How much is this book?","Thirty yuan."],["How much is a cup of coffee?","Fifteen yuan."],["How is your dorm?","Clean and quiet."],["How's the weather today?","The weather is nice today."],["How is your Chinese?","So-so."],["How is this restaurant?","Very good."],["Shall we go to the park?","Sure!"],["How do you get to school?","I take the subway."],["How do you read this character?","It's read “zhù”."],["Do you drink tea or coffee?","I drink tea."],["Are you a teacher or a student?","I'm a student."],["Do you take the subway or ride a bike?","I take the subway."],["Do you like Chinese or Western food?","I like Chinese food."],["Are you going today or tomorrow?","I'm going tomorrow."],["What time is it now?","It's half past eight."],["What time do you get up every day?","I get up at seven every day."],["What time is your class?","My class is at eight."],["What time do you go to bed?","I go to bed at eleven."],["When do you go to the library?","I go in the afternoon."],["When is your birthday?","My birthday is May 10th."],["Why do you study Chinese?","Because I like China."],["Why aren't you going?","Because I'm busy."],["Why do you like it here?","Because it's quiet here."],["You're an international student, right?","Right, I'm an international student."],["Shall we go to the canteen?","OK, let's go."],["Let's go tomorrow, OK?","OK."],["May I come in?","Please come in."],["A bit cheaper, OK?","All right, twenty yuan."]],"REF":{"mw":["one person","three teachers","five family members","18 students","two books","one bed","one chair","one pen","one road","one piece of clothing","a pair of shoes","one dog","one bicycle","one café","three floors","one room","one building","one computer","one phone","a cup of tea","a bottle of water","a bowl of rice","one meal","five yuan","five mao","two jin of apples","twenty years old","eight o'clock","ten minutes","the 15th","two class periods","one course","went once","say it again","wait a moment","some books","a kind of fruit","one email","one sentence","page one","one tree","one flower","one song","one apartment"],"pos":["The book is on top of the table.","The dog is under the chair.","The library is in front of the classroom building.","The dorm is behind the canteen.","The bank is to the left of the supermarket.","The toilet is on the right.","There are many students inside the classroom.","He is outside.","The canteen is beside the library.","I sit between them.","The café is opposite the school.","There is a restaurant near the school.","The gym is east of the library.","The park is west of the school.","The dorm is south of the sports field.","The bank is north of the school.","The book is on the table.","There is a clock in the classroom.","My room is upstairs.","The laundry is downstairs.","Please sit here.","The canteen is over there.","Where is the toilet?","Go straight ahead.","Walk forward.","Walk back.","Turn left.","Turn right.","Go straight.","The bank is far.","The canteen is near.","The dorm is close to the classroom building."]},"TONES":[["First: high and level ‾","like singing one steady note"],["Second: rising ↗","like asking “Yes?”"],["Third: falls then rises ↘↗","drop your voice low"],["Fourth: sharp fall ↘","like a command: “Stop!”"],["Neutral: short and light","no stress"]],"SOUNDS":["The difference is the puff of air, not voicing. Hold a tissue in front of your mouth: it moves with p t k and stays still with b d g.","A rough h, made further back in the throat than an English h.","Tongue flat with its tip behind the lower teeth, lips smiling: j ≈ a soft “j”, q ≈ a soft “ch” with a puff of air, x ≈ a soft “sh”.","Curl the tongue tip back: zh ≈ the “j” in “judge”, ch ≈ “ch” with a puff of air, sh ≈ “sh”, r is between an English r and the s in “measure”.","Tongue tip behind the teeth: z ≈ the “ds” in “kids”, c ≈ the “ts” in “cats” with a puff of air, s ≈ s.","Say “ee”, then round your lips without moving the tongue. After j q x y it is written u but pronounced ü.","-n: the tongue tip touches the gum ridge; -ng comes from the back of the mouth, as in “sing”.","Not “ee”: a sound from the middle of the mouth with unrounded lips, close to “uh”."],"SANDHI":[["Third + third","The first one is read as a second tone."],["Three third tones in a row","Split them by meaning. If the grouping is (1 + 2), the middle one becomes second and the first stays low; if it is (2 + 1), the first and second both become second. The last one always stays third."],["The half third tone","Before a first, second, fourth or neutral tone, the third tone is just low, without the rise at the end. The full third tone ↘↗ is heard when the word stands alone or ends the sentence."],["不 bù","Before a fourth tone it becomes bú."],["不 in the middle","Between two repeated words (A不A) or inside a word it becomes a light neutral bu."],["一 yī","Before a fourth tone yí; before a first, second or third tone yì; alone or in counting yī."],["When does 一 stay yī?","Alone, in counting, numbers and dates, at the end of a word, and in ordinals (第一). Between a repeated verb it becomes neutral yi. Note: 一个 is read yí ge because 个 is originally a fourth tone."],["Is the change written in pinyin?","The third-tone change is never written: the mark stays third and only the pronunciation changes. For 一 and 不, textbooks for foreign learners usually write the spoken tone (as this page does), while dictionaries write the original yī and bù. Compare with your book."],["The neutral tone","The second syllable is light and short."]],"SPELL":[["y instead of i at the start of a syllable","When a syllable starts with i and has no consonant before it: i alone (and in, ing) gets a y in front; in compound finals the i itself becomes y."],["w instead of u at the start of a syllable","The same rule with u: alone it gets a w in front; in compound finals the u becomes w."],["yu instead of ü at the start of a syllable","A syllable starting with ü is written yu, without the dots, but it is still pronounced ü (not “you”)."],["The dots of ü after j q x","After j q x the dots are dropped, because a plain u never follows these consonants, so every u after them is read ü. After n and l the dots stay, because nu / nü and lu / lü are different words."],["iou · uei · uen are shortened after a consonant","After a consonant the middle vowel is dropped in writing, but it is still heard lightly. Without a consonant they are written in full: you · wei · wen."],["Where does the tone mark go?","Always on a vowel, in this order: on a if there is one; otherwise on o or e; otherwise on i, u or ü. Exception: in iu and ui it goes on the last letter. An i with a tone mark loses its dot. Neutral syllables have no mark."],["The apostrophe ( ' )","Inside a word, when a syllable starting with a, o or e follows another syllable, an apostrophe separates them so they are not read as one syllable."],["-i after z c s and zh ch sh r","Here i is not “ee”: it is just the consonant's own sound held on, with the tongue staying where it is. After other consonants it is a normal “ee”."],["o after b p m f","Written o, but pronounced close to uo."],["ian and üan: written a, pronounced e","In ian (yan) and üan (yuan) the a sounds close to the e in “yes”, not an open “ah”."],["er and the suffix r (儿化)","er is a syllable of its own. When 儿 is added to the end of a word it is written as just r and merges with the syllable before it, without adding a new syllable."],["Spaces and capital letters","The syllables of one word are written together, with a space between words. The first word of a sentence and proper names start with a capital letter."]],"PR":[["The four tones and the neutral tone","Simple finals: a o e i u ü","Initials: b p m f · d t n l (note: p and t have a puff of air)"],["Initials: g k h","Compound finals: ai ei ao ou","Third-tone change: third + third → the first is read as second (nǐ hǎo → ní hǎo)"],["Initials: j q x (flat tongue, smiling lips)","Nasal finals: an en ang eng ong","不 changes: bù → bú before a fourth tone (不是 bú shì)"],["z c s (tongue tip behind the teeth)","zh ch sh r (tongue curled back)","The special final -i after these sounds (zi ci si / zhi chi shi ri)","一 changes: yí before a fourth tone (一个 yí gè), yì before a first, second or third tone (一天 yì tiān)"],["Compound finals with i-, u- and ü- (ia ie iao · ua uo uai · üe üan)","The neutral tone (māma) and erhua (nǎr)","Spelling rules: y and w at the start of a syllable, and dropping the dots of ü after j q x y (qù = qü)"],["All 21 initials and all the finals","The four tones: mā má mǎ mà","The neutral tone: māma, duìbuqǐ"],["Third-tone change: nǐ hǎo → ní hǎo","不 changes: bù hē, bù lái, bù mǎi but bú qù"],["Telling the four tones apart by ear","Telling similar initials apart: b/p · d/t · g/k"]],"BOOK":{"j":["Comprehensive course: 40 lessons (volume 1)","Lesson titles and grammar points are confirmed from the 2nd edition's table of contents. Word lists are approximate, except lesson 8, which is copied from the book. Check them against the 生词 page in your book and add what is missing with “Add a word”."],"k":["Speaking course","All 23 titles are confirmed. The words of lessons 1 and 2 are confirmed from the book; the other lists are approximate, based on the lesson title. Check them against your book."],"t":["Listening course","The book has 30 lessons. Titles of lessons 1–19 are confirmed; titles 20–30 could not be found in Chinese, so they are not included. Word lists are approximate (lessons 7 and 9 come partly from flashcards for this book). Check them against your book."]},"CATS":["Questions","Sentence types","Word order","Negation","Possession & 的","Existence & place","Numbers, time & money","Adverbs","Modal verbs","Aspect","Comparison","Complements","Prepositions","Conjunctions","Requests & suggestions"],"PCATS":["Verbs","Place & movement","Time, numbers & counting","Questions","Adverbs & particles"],"WTYPES":["Verbs","Modal verbs","Adjectives","Pronouns","Question words","Adverbs","Conjunctions function lessonExtra(b,l){
 const map=new Map(allWords().map(w=>[w[0],w])),have=new Set(lw(b.id,l).map(w=>w[0]));
 const txt=[l.t].concat(l.s.map(s=>s[0]),l.g.flatMap(id=>G[id]?G[id][4].map(e=>e.split('|')[0]):[])).join(' ');
 const out=[],seen=new Set();
 for(let i=0;i<txt.length;){let hit=null;for(let n=Math.min(5,txt.length-i);n>0;n--){const s=txt.substr(i,n);if(map.has(s)){hit=s;break}}

 return head('النطق والنغمات','اضغط على أي حرف لتسمعه')+'<div class="tabs"><button class="chip" data-a="jump" data-id="s-sounds">الأصوات الصعبة</button><button class="chip" data-a="jump" data-id="s-spell">قواعد كتابة البينيين</button><button class="chip" data-a="jump" data-id="s-sandhi">تغيّر النغمات</button></div>'+
 `<div class="card"><b>النغمات</b>${TONES.map(t=>`<div class="tone">${sp(t[0])}<span class="hz zh kai">${t[0]}</span><div class="grow"><span class="py">${t[1]}</span> · <b>${t[2]}</b><div class="sub" style="margin:0">${t[3]}</div></div></div>`).join('')}</div>
 <div class="card"><b>تمرين: أيّ نغمة سمعت؟</b><div class="sub">النتيجة: ${arN(TQs.ok)} / ${arN(TQs.n)}</div><div class="row" style="justify-content:center;margin:10px 0">${sp(TQs.q[0])}${TQs.r!==null?`<span class="zh kai" style="font-size:40px">${TQs.q[0]}</span>`:'<span class="sub" style="margin:0">اضغط واستمع</span>'}</div><div class="btns">${[1,2,3,4].map(n=>`<button class="opt ${TQs.r!==null&&n===TQs.q[1]?'good':''} ${TQs.r===n&&n!==TQs.q[1]?'bad':''}" style="margin:0" data-a="tq" data-n="${n}">${['‾','↗','↘↗','↘'][n-1]}<br><small>${arN(n)}</small></button>`).join('')}</div>${TQs.r!==null?'<div style="height:8px"></div><button class="btn" data-a="tqn">التالي</button>':''}</div>
 <h2 id="s-sounds">الأصوات الصعبة على العربي</h2>${SOUNDS.map(s=>`<div class="card"><b class="py" style="font-size:18px">${s[0]}</b><p style="margin:6px 0 10px;font-size:14.5px">${s[1]}</p>${s[2].map(p=>`<button class="pair zh" data-a="say" data-t="${p[0]}">${p[0]} <span class="py">${p[1]}</span></button>`).join('')}</div>`).join('')}
 <h2 id="s-spell">قواعد كتابة البينيين (拼写规则)</h2><p class="sub">كيف تُكتب الحركات i · u · ü وأين توضع علامة النغمة. اضغط على المثال لتسمعه.</p>${SPELL.map(s=>`<div class="card"><b>${s[0]}</b><p style="margin:4px 0 8px;font-size:14.5px">${s[1]}</p>${s[2]?`<div class="gf" style="direction:ltr;margin:0 0 10px">${s[2]}</div>`:''}${s[3].map(p=>`<button class="pair zh" data-a="say" data-t="${p[0]}">${p[0]} <span class="py">${p[1]}</span></button>`).join('')}</div>`).join('')}
 <h2 id="s-sandhi">قواعد تغيّر النغمة (变调)</h2><p class="sub">النغمة المكتوبة قد تختلف عن المنطوقة في هذه الحالات.</p>${SANDHI.map(s=>`<div class="card"><b>${s[0]}</b><p style="margin:4px 0 10px;font-size:14.5px">${s[1]}</p>${s[2].map(p=>`<button class="pair zh" data-a="say" data-t="${p[0]}">${p[0]} <span class="py">${p[1]}</span></button>`).join('')}</div>`).join('')}`}

function startFlash(list,title){if(!list.length)return toast('لا توجد كلمات');const due=list.filter(w=>!S.box[w[0]]||S.box[w[0]].d<=today());F={list:shuffle(due.length?due:list).slice(0,20),i:0,flip:false,title,ok:0};go('flash')}
function flash(){const n=F.list.length;if(F.i>=n)return head(F.title)+`<div class="card fc"><div class="hz zh kai">好</div><b style="font-size:20px">أحسنت! 加油！</b><div class="sub">حفظت ${arN(F.ok)} من ${arN(n)} في هذه الجولة.</div></div><div class="btns"><button class="btn" data-a="fagain">جولة أخرى</button><button class="btn alt" data-a="back">رجوع</button></div>`;
 const w=F.list[F.i];return head(F.title,`${arN(F.i+1)} / ${arN(n)}`)+`<div class="prog"><i style="width:${F.i/n*100}%"></i></div>
 <div class="card fc" data-a="flip"><div class="hz zh kai">${esc(w[0])}</div>${F.flip?`<div class="py">${esc(w[1])}</div>${w[2]?`<div class="en">${esc(w[2])}</div>`:''}<div class="ar">${esc(w[3]||'')}</div>${w[5]?`<div class="st">${esc(w[5])}</div>`:''}`:'<div class="sub">حاول أن تنطقه وتتذكّر معناه، ثم اضغط</div>'}</div>
 ${F.flip?`<div class="row" style="justify-content:center;margin-bottom:12px">${sp(w[0])}</div><div class="btns"><button class="btn alt" data-a="fr" data-ok="0">لم أحفظها</button><button class="btn jade" data-a="fr" data-ok="1">حفظتها ✓</button></div>`:`<button class="btn" data-a="flip">اكشف</button>`}`}
function startQuiz(words,title,types){words=words.filter(w=>w[2]||w[3]);if(words.length<1)return toast('لا توجد كلمات');const pool=allWords();types=types||['h2m','l2h','m2h','h2p'];
 Q={title,i:0,score:0,ans:null,qs:shuffle(words).slice(0,10).map((w,i)=>{const t=types[i%types.length];const ds=[];const src=shuffle(words.length>=8?words.concat(pool):pool);for(const x of src){if(ds.length>=3)break;if(x[0]!==w[0]&&x[1]!==w[1]&&x[2]!==w[2]&&!ds.some(d=>d[0]===x[0]||d[1]===x[1]))ds.push(x)}return{w,t,opts:shuffle([w].concat(ds))}})};go('quiz');if(Q.qs[0].t==='l2h')say(Q.qs[0].w[0])}
function quiz(){const n=Q.qs.length;if(Q.i>=n)return head(Q.title)+`<div class="card fc"><div class="hz zh kai">${Q.score>=n*0.8?'棒':'加油'}</div><b style="font-size:22px">${arN(Q.score)} / ${arN(n)}</b><div class="sub">${Q.score>=n*0.8?'ممتاز! 太棒了！':'جيد — راجع الكلمات التي أخطأت فيها وحاول مجددًا.'}</div></div><button class="btn" data-a="back">رجوع</button>`;
 const q=Q.qs[Q.i],w=q.w;const P_={h2m:`<div class="hz zh kai">${esc(w[0])}</div><div class="sub">ما المعنى؟</div>`,h2p:`<div class="hz zh kai">${esc(w[0])}</div><div class="sub">ما النطق (pinyin)؟</div>`,m2h:`<div class="m en">${esc(w[2])}</div><div class="sub">${esc(w[3]||'')} — اختر الحرف</div>`,l2h:`<div class="row" style="justify-content:center">${sp(w[0])}</div><div class="sub" style="margin-top:8px">استمع واختر ما سمعت</div>`}[q.t];
 const lab=o=>q.t==='h2m'?`<span class="en">${esc(o[2])}</span>${o[3]?` · ${esc(o[3])}`:''}`:q.t==='h2p'?`<span class="py">${esc(o[1])}</span>`:esc(o[0]);
 return head(Q.title,`${arN(Q.i+1)} / ${arN(n)} · النتيجة ${arN(Q.score)}`)+`<div class="prog"><i style="width:${Q.i/n*100}%"></i></div><div class="qp">${P_}</div>${q.opts.map((o,i)=>`<button class="opt ${q.t==='m2h'||q.t==='l2h'?'zh':''} ${Q.ans!==null&&o===w?'good':''} ${Q.ans===i&&o!==w?'bad':''}" data-a="qa" data-i="${i}">${lab(o)}</button>`).join('')}${Q.ans!==null?`<div class="card" style="text-align:center"><span class="zh" style="font-size:24px">${esc(w[0])}</span> <span class="py">${esc(w[1])}</span><br><span class="en">${esc(w[2])}</span> · ${esc(w[3]||'')}</div><button class="btn" data-a="qn">التالي</button>`:''}`}
const chW=()=>CH.map(c=>[c[0],c[1],'',c[2],'',c[3]+' — '+c[4]]);

/* ================= ACTIONS ================= */
const A={
 lang:d=>{if((d.l==='en')!==EN)setLang(d.l)},
 tab:d=>{flt.q='';tab(d.v)},go:d=>go(d.v),back,
 say:d=>say(d.t),slow:d=>say(d.t,'zh',0.5),sayen:d=>say(d.t,'en'),
 book:d=>go('book',{b:d.b}),
 les:d=>{S.last=[d.b,+d.n];save();go('lesson',{b:d.b,n:+d.n,t:'w'})},
 lt:d=>{V.t=d.t;render(true)},
 done:()=>{const k=V.b+V.n;S.done[k]=!S.done[k];save();render()},
 tpy:()=>{flt.py=!flt.py;render()},thz:()=>{flt.hz=!flt.hz;render()},
 addw:()=>{const v=[0,1,2,3].map(i=>$('#aw'+i).value.trim());if(!v[0])return toast('اكتب الكلمة بالصينية أولًا');const k=V.b+V.n;(S.custom[k]=S.custom[k]||[]).push(v);save();render();toast('أُضيفت الكلمة')},
 delw:d=>{const k=V.b+V.n;S.custom[k].splice(+d.i,1);save();render()},
 lflash:()=>{const l=lesson(V.b,V.n);startFlash(lw(V.b,l),l.t)},
 lquiz:()=>{const l=lesson(V.b,V.n);startQuiz(lw(V.b,l),l.t)},
 llisten:()=>{const l=lesson(V.b,V.n);startQuiz(lw(V.b,l),'استماع · '+l.t,['l2h'])},
 vflash:()=>startFlash(vocabWords(),'بطاقات الكلمات'),
 vquiz:()=>startQuiz(vocabWords(),'اختبار الكلمات'),
 cflash:()=>startFlash(chW(),'بطاقات الأحرف'),
 cquiz:()=>startQuiz(CH.map(c=>[c[0],c[1],'',c[2]]),'اختبار الأحرف',['h2m','h2p','l2h']),
 review:()=>{const due=allWords().filter(w=>S.box[w[0]]&&S.box[w[0]].d<=today());if(due.length)startFlash(due,'مراجعة اليوم');else{const b=BOOKS.find(b=>b.lessons.some(l=>!S.done[b.id+l.n]))||BOOKS[0];const l=b.lessons.find(l=>!S.done[b.id+l.n])||b.lessons[0];toast('لا مراجعات مستحقّة — نبدأ بكلمات جديدة');startFlash(lw(b.id,l),l.t)}},
 quickquiz:()=>{const seen=allWords().filter(w=>S.box[w[0]]);startQuiz(seen.length>=6?seen:allWords().slice(0,60),'اختبار سريع')},
 flip:()=>{if(!F.flip){F.flip=true;say(F.list[F.i][0]);render()}},
 fr:d=>{const ok=d.ok==='1';rate(F.list[F.i][0],ok);if(ok)F.ok++;F.i++;F.flip=false;render(true)},
 fagain:()=>{F.i=0;F.ok=0;F.flip=false;F.list=shuffle(F.list);render(true)},
 qa:d=>{if(Q.ans!==null)return;const q=Q.qs[Q.i];Q.ans=+d.i;const ok=q.opts[Q.ans]===q.w;if(ok)Q.score++;rate(q.w[0],ok);say(q.w[0]);render()},
 qn:()=>{Q.i++;Q.ans=null;render(true);if(Q.i<Q.qs.length&&Q.qs[Q.i].t==='l2h')say(Q.qs[Q.i].w[0])},
 cat:d=>{flt.cat=d.c;render()},
 pc:d=>{flt.pc=d.c;flt.q='';render()},
 wc:d=>{flt.wc=d.c;if(flt.book==='mw'||flt.book==='pos')flt.book='';render()},vref:d=>{flt.book=d.b;flt.wc='';render()},
 qc:d=>{flt.qc=d.c;flt.q='';render()},qh:()=>{flt.qh=!flt.qh;render()},qrev:(d,el)=>el.classList.remove('hide'),
 vb:d=>{flt.book=d.b;render()},
 ch:d=>{const c=CH[+d.i];say(c[0]);$('#sheet').innerHTML=`<div class="in"><div class="hz zh kai">${c[0]}</div><div class="py" style="font-size:22px">${c[1]}</div><div style="font-size:18px;margin:4px 0 10px">${c[2]}</div><div class="card" style="text-align:start"><b>الأجزاء:</b> <span class="zh">${c[3]}</span><br><b>القصة:</b> ${c[4]}</div><div class="btns"><button class="btn alt" data-a="say" data-t="${c[0]}">🔊 استمع</button><button class="btn" data-a="close">تم</button></div><p class="sub" style="margin:10px 0 0">اكتب الحرف على الورق ٥ مرات وأنت تنطقه.</p></div>`;$('#sheet').classList.add('on')},
 close:()=>$('#sheet').classList.remove('on'),
 jump:d=>{const e=document.getElementById(d.id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},
 tq:d=>{if(TQs.r!==null)return;TQs.r=+d.n;TQs.n++;if(TQs.r===TQs.q[1])TQs.ok++;render()},
 tqn:()=>{TQs.q=shuffle(TQ.filter(x=>x!==TQs.q))[0];TQs.r=null;render();say(TQs.q[0])}
};
document.addEventListener('click',e=>{if(e.target.id==='sheet'){A.close();return}const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el.dataset,el)});
document.addEventListener('input',e=>{if(e.target.id==='qq'){flt.q=e.target.value;$('#qlist').innerHTML=qaList()}if(e.target.id==='pq'){flt.q=e.target.value;$('#plist').innerHTML=patList()}if(e.target.id==='vq'){flt.q=e.target.value;$('#vlist').innerHTML=vocabList()}if(e.target.id==='gq'){flt.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#gq');i.focus();try{i.setSelectionRange(p,p)}catch(x){}}});
setLang(S.lang==='en'?'en':'ar',true);
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
